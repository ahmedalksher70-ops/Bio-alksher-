workflows:
  android-apk:
    name: Bio Alksher 2.2 Build Fix
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract Bio Alksher 2.2 project
        script: |
          set -euo pipefail
          mkdir -p source
          test -f Bio_Alksher_BuildFix_2_2_Source.zip
          unzip -o Bio_Alksher_BuildFix_2_2_Source.zip -d source

      - name: Build Android debug APK
        script: |
          set -euo pipefail
          GRADLE_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$GRADLE_FILE"
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

    artifacts:
      - source/**/app/build/outputs/apk/debug/*.apk
