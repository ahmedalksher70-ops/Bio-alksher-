workflows:
  android-apk:
    name: Biochemistry Easy with Me
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract Android project
        script: |
          set -e
          mkdir -p source
          unzip -o BiochemistryEasyWithMe_Android_ApprovedDesign_v3.zip -d source

      - name: Build Android APK
        script: |
          set -e
          GRADLE_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$GRADLE_FILE"
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

    artifacts:
      - source/**/app/build/outputs/apk/debug/*.apk
