workflows:
  android-apk:
    name: Biochemistry Easy with Me
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract project
        script: |
          mkdir -p source
          unzip -o BiochemistryEasyArabic_Source.zip -d source

      - name: Fix Java finish method
        script: |
          JAVA_FILE=$(find source -name MainActivity.java -print -quit)
          test -n "$JAVA_FILE"
          perl -0pi -e 's/\bfinish\(\)/finishQuiz()/g' "$JAVA_FILE"

      - name: Build Android APK
        script: |
          PROJECT_DIR=$(find source \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

    artifacts:
      - source/**/app/build/outputs/apk/debug/*.apk
