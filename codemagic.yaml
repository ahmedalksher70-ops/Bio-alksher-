
workflows:
  android-apk:
    name: Bio Alksher - Icon Integrated Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Rebuild source ZIP from three parts
        script: |
          set -e

          PART0="Bio_Alksher_Icon_Integrated.part000"
          PART1="Bio_Alksher_Icon_Integrated.part001"
          PART2="Bio_Alksher_Icon_Integrated.part002"

          test -f "$PART0"
          test -f "$PART1"
          test -f "$PART2"

          cat "$PART0" "$PART1" "$PART2" > Bio_Alksher_Icon_Integrated.zip

          unzip -t Bio_Alksher_Icon_Integrated.zip

          mkdir -p source
          unzip -o Bio_Alksher_Icon_Integrated.zip -d source

      - name: Verify Java fix
        script: |
          set -e
          JAVA_FILE=$(find source -type f -name LecturePdfActivity.java -print -quit)
          test -n "$JAVA_FILE"
          if grep -n 'half.weight' "$JAVA_FILE"; then
            echo "ERROR: Old Java code still exists"
            exit 1
          fi
          echo "Java source check passed"

      - name: Locate Android project
        script: |
          set -e
          GRADLE_FILE=$(find source -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          test -n "$GRADLE_FILE"
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "$PROJECT_DIR" > /tmp/android_project_dir
          echo "Android project: $PROJECT_DIR"

      - name: Build Android APK
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/android_project_dir)
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Extract SHA-1 and SHA-256
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/android_project_dir)
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon :app:signingReport
          else
            gradle --no-daemon :app:signingReport
          fi

    artifacts:
      - source/**/app/build/outputs/apk/debug/*.apk
