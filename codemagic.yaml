
workflows:
  android-apk:
    name: Bio Alksher Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Verify the three uploaded project archives
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          PART1="Bio_Alksher_New_Approved_Registration_Part1.zip"
          PART2="Bio_Alksher_New_Approved_Registration_Part2.zip"
          PART3="Bio_Alksher_New_Approved_Registration_Part3.zip"

          for FILE in "$PART1" "$PART2" "$PART3"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing required archive: $FILE"
              echo "Upload all three ZIP files to the Codemagic build directory."
              exit 1
            fi
            unzip -t "$FILE" >/dev/null
            SIZE=$(stat -f%z "$FILE")
            LIMIT=$((25 * 1024 * 1024))
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "ERROR: $FILE is larger than 25 MiB."
              exit 1
            fi
            echo "Verified: $FILE ($SIZE bytes)"
          done

      - name: Merge Part 1, Part 2 and Part 3
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          rm -rf source
          mkdir -p source
          unzip -oq Bio_Alksher_New_Approved_Registration_Part1.zip -d source
          unzip -oq Bio_Alksher_New_Approved_Registration_Part2.zip -d source
          unzip -oq Bio_Alksher_New_Approved_Registration_Part3.zip -d source

          PROJECT_DIR="source/Bio_Alksher_New_Project_Approved_Entry"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Expected project folder was not found: $PROJECT_DIR"
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Project archives merged successfully."

      - name: Validate Android project configuration
        script: |
          set -e
          cd "$CM_BUILD_DIR/$PROJECT_DIR"

          for FILE in settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/google-services.json; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Required project file is missing: $FILE"
              exit 1
            fi
          done

          for FILE in \
            app/src/main/java/com/biochem/easy/MainActivity.java \
            app/src/main/java/com/biochem/easy/LecturePdfActivity.java \
            app/src/main/java/com/biochem/easy/DeviceIdentity.java \
            app/src/main/java/com/biochem/easy/AppsScriptApi.java; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Required source file is missing: $FILE"
              exit 1
            fi
          done

          grep -Eq 'minSdk[[:space:]]*=?[[:space:]]*24|minSdkVersion[[:space:]]+24' app/build.gradle
          grep -q 'FLAG_SECURE' app/src/main/java/com/biochem/easy/LecturePdfActivity.java
          grep -q 'biochemistry-easy-with' app/google-services.json

          python3 - <<'PY'
          import json
          with open('app/google-services.json', encoding='utf-8') as f:
              data = json.load(f)
          project_id = data.get('project_info', {}).get('project_id')
          if project_id != 'biochemistry-easy-with':
              raise SystemExit(f'Unexpected Firebase project_id: {project_id}')
          print('Firebase configuration JSON is valid:', project_id)
          PY

          if grep -Rni 'half\.weight' app/src/main 2>/dev/null; then
            echo "ERROR: Unexpected half.weight reference found in app sources."
            exit 1
          fi
          echo "Android project validation passed."

      - name: Build debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean :app:assembleDebug
          else
            gradle --no-daemon clean :app:assembleDebug
          fi

      - name: Verify generated APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK was not generated at $APK"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"
          echo "APK build completed successfully."

    artifacts:
      - source/**/app/build/outputs/apk/debug/*.apk
      - source/**/app/build/outputs/mapping/**
