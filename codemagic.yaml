workflows:
  android-apk:
    name: Bio Alksher - Build 2.2
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract Bio Alksher project
        script: |
          set -e
          mkdir -p source
          unzip -o Bio_Alksher_BuildFix_2_2_Source.zip -d source

      - name: Build Android APK
        script: |
          set -e
          GRADLE_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$GRADLE_FILE"
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

    artifacts:
      - source/**/app/build/outputs/apk/debug/*.apk



