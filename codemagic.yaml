workflows:
  android-apk:
    name: Bio Alksher - Complete Update Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract three corrected project ZIP files
        script: |
          set -e

          PART1="Bio_Alksher_Complete_Update_minSdk24_Part1.zip"
          PART2="Bio_Alksher_Complete_Update_minSdk24_Part2.zip"
          PART3="Bio_Alksher_Complete_Update_minSdk24_Part3.zip"

          test -f "$PART1"
          test -f "$PART2"
          test -f "$PART3"

          mkdir -p source

          echo "Extracting Part 1..."
          unzip -o "$PART1" -d source

          echo "Extracting Part 2..."
          unzip -o "$PART2" -d source

          echo "Extracting Part 3..."
          unzip -o "$PART3" -d source

          echo "All archives extracted successfully."

      - name: Verify Java fix
        script: |
          set -e

          JAVA_FILE=$(find source -type f \
            -name LecturePdfActivity.java -print -quit)

          test -n "$JAVA_FILE"

          if grep -n 'half.weight' "$JAVA_FILE"; then
            echo "ERROR: Old Java code still exists"
            exit 1
          fi

          echo "Java source check passed"

      - name: Verify Android minSdk
        script: |
          set -e

          GRADLE_FILE=$(find source -type f \
            -path '*/app/build.gradle' -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find source -type f \
              -path '*/app/build.gradle.kts' -print -quit)
          fi

          test -n "$GRADLE_FILE"

          echo "Checking: $GRADLE_FILE"
          grep -n 'minSdk' "$GRADLE_FILE"

          if ! grep -Eq 'minSdk(Version)?[[:space:]]*[= ]+[[:space:]]*24|minSdk[[:space:]]*=[[:space:]]*24' "$GRADLE_FILE"; then
            echo "ERROR: minSdk 24 was not found"
            exit 1
          fi

          echo "minSdk verification passed"

      - name: Locate Android project
        script: |
          set -e

          GRADLE_FILE=$(find source -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          test -n "$GRADLE_FILE"

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "$PROJECT_DIR" > /tmp/android_project_dir

          echo "Android project: $PROJECT_DIR"

      - name: Build Android APK
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/android_project_dir)
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Extract SHA-1 and SHA-256
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/android_project_dir)
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon :app:signingReport
          else
            gradle --no-daemon :app:signingReport
          fi

    artifacts:
      - source/**/build/outputs/apk/debug/*.apk



