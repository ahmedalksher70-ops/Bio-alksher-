
workflows:
  android-apk:
    name: Bio Alksher - Login Fix Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Rebuild source ZIP from three parts
        script: |
          set -e

          cat BioAlksher_Fix_000.part \
              BioAlksher_Fix_001.part \
              BioAlksher_Fix_002.part \
              > BioAlksher_Fix_Combined.zip

          unzip -t BioAlksher_Fix_Combined.zip

          mkdir -p source
          unzip -o BioAlksher_Fix_Combined.zip -d source

      - name: Locate Android project
        script: |
          set -e

          GRADLE_FILE=$(find source -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          test -n "$GRADLE_FILE"

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "$PROJECT_DIR" > /tmp/android_project_dir

          echo "Android project: $PROJECT_DIR"

      - name: Build Android APK
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/android_project_dir)
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

    artifacts:
      - source/**/app/build/outputs/apk/debug/*.apk
