
workflows:
  android-apk:
    name: Bio Alksher Android APK - Student Gate Fixed
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Verify latest StudentGate project archives
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          PART1="Bio_Alksher_StudentGate_Fixed_25MB_Part1.zip"
          PART2="Bio_Alksher_StudentGate_Fixed_25MB_Part2.zip"
          PART3="Bio_Alksher_StudentGate_Fixed_25MB_Part3.zip"

          LIMIT=$((25 * 1024 * 1024))

          for FILE in "$PART1" "$PART2" "$PART3"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing latest project archive: $FILE"
              exit 1
            fi

            unzip -t "$FILE" >/dev/null
            SIZE=$(stat -f%z "$FILE")

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "ERROR: $FILE exceeds 25 MB."
              exit 1
            fi

            echo "Verified: $FILE ($SIZE bytes)"
          done

          echo "All latest project archives verified."

      - name: Remove old extracted project and merge latest parts
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          rm -rf source
          mkdir -p source

          unzip -oq Bio_Alksher_StudentGate_Fixed_25MB_Part1.zip -d source
          unzip -oq Bio_Alksher_StudentGate_Fixed_25MB_Part2.zip -d source
          unzip -oq Bio_Alksher_StudentGate_Fixed_25MB_Part3.zip -d source

          PROJECT_DIR="source"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Latest StudentGate project extracted successfully."

      - name: Validate Android project and Firebase
        script: |
          set -e
          cd "$CM_BUILD_DIR/$PROJECT_DIR"

          for FILE in \
            gradle.properties \
            app/src/main/AndroidManifest.xml \
            app/google-services.json \
            app/src/main/java/com/biochem/easy/MainActivity.java \
            app/src/main/java/com/biochem/easy/LecturePdfActivity.java \
            app/src/main/java/com/biochem/easy/DeviceIdentity.java \
            app/src/main/java/com/biochem/easy/AppsScriptApi.java; do

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing required file: $FILE"
              exit 1
            fi
          done

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle is missing."
            exit 1
          fi

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ERROR: Root build.gradle is missing."
            exit 1
          fi

          APP_GRADLE="app/build.gradle"
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE="app/build.gradle.kts"
          fi

          grep -Eq 'minSdk[[:space:]]*=?[[:space:]]*24|minSdkVersion[[:space:]]+24' "$APP_GRADLE"

          grep -q 'FLAG_SECURE' app/src/main/java/com/biochem/easy/LecturePdfActivity.java

          grep -q 'biochemistry-easy-with' app/google-services.json

          python3 - <<'PY'
          import json

          with open('app/google-services.json', encoding='utf-8') as f:
              data = json.load(f)

          project_id = data.get('project_info', {}).get('project_id')

          if project_id != 'biochemistry-easy-with':
              raise SystemExit('Incorrect Firebase project: ' + str(project_id))

          print('Firebase configuration verified:', project_id)
          PY

          if grep -Rni 'half\.weight' app/src/main 2>/dev/null; then
            echo "ERROR: Unexpected half.weight reference found."
            exit 1
          fi

          echo "Android and Firebase validation passed."

      - name: Build latest Bio Alksher APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean :app:assembleDebug
          else
            gradle --no-daemon clean :app:assembleDebug
          fi

      - name: Verify generated APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          echo "Bio Alksher APK built successfully."

    artifacts:
      - source/app/build/outputs/apk/debug/*.apk
      - source/app/build/outputs/mapping/**
